name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Секреты и данные пользователей не в репозитории
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^data/' || true)
          if [ -n "$bad" ]; then
            echo "В репозиторий попали файлы, которых там быть не должно:"
            echo "$bad"
            exit 1
          fi

      - name: Битые файлы-диффы
        run: |
          if grep -rlE '^(\+\+\+|---) .*\((原始|修改后)\)' --include='*.go' .; then
            echo "В .go-файлах остались строки от diff"
            exit 1
          fi

      - name: Проверка форматирования
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Тесты с детектором гонок
        run: go test -race -count=1 ./...

      - name: Сборка
        run: go build -trimpath -o /dev/null ./cmd/bot
