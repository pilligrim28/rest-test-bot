# Запуск бота с сохранением данных между перезапусками.
services:
  bot:
    build: .
    image: rest-test-bot:latest
    container_name: rest-test-bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # Путь внутри контейнера; том монтируется ниже.
      DATA_FILE: /app/data/users.json
      BROADCAST_DELAY_MS: "60"

    volumes:
      - ./data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # По умолчанию long polling — входящие порты не нужны.
    # Для режима вебхука раскомментируйте и поставьте перед ботом HTTPS-прокси:
    # ports:
    #   - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
